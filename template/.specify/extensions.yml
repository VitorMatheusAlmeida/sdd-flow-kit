# sdd-flow-kit hooks in the spec-kit cycle.
# The spec-kit generated SKILL.md files (speckit-*) read this file before and after each command.
# Every hook here is optional but recommended, like /speckit-clarify: spec-kit suggests the command at the right
# point of the cycle, and it runs when you invoke it. Skip it only when the feature has nothing for it (no screens, no tables).
# The skills it calls (speckit-flows, speckit-tables) are not generated by spec-kit: they survive upgrades.
# With no argument, each skill works out what to do from the state of the feature folder.
# Project setup (language, base branch, schema source) comes from sdd.config.json at the repository root.

hooks:
  after_plan:
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Writes tabelas.planejado.dbml (paste into dbdiagram) with the tables of the spec, from the data model
      prompt: Recommended — generate the diagram of the tables the feature will touch
      optional: true
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Creates fluxos.drawio (detailed decision flowchart) and roteiros/R##-*.md (walkthrough scripts) from spec and plan
      prompt: Recommended — generate the flowchart and the walkthrough scripts
      optional: true

  after_tasks:
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Checks the draw.io against the scripts and appends a walkthrough task for every script that lacks one
      prompt: Recommended — ensure the walkthrough tasks
      optional: true

  after_implement:
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Checks tabelas.planejado.dbml against the implemented schema
      prompt: Recommended — update the table diagram
      optional: true

  before_converge:
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Reads what the owner changed in fluxos.drawio since the last commit, judges each change and turns the valid ones into impact on scripts, spec and tasks
      prompt: Recommended — sync the flowchart before converging
      optional: true
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Absorbs the owner's hand edits to tabelas.planejado.dbml (after judging them) and checks it
      prompt: Recommended — update the table diagram
      optional: true
