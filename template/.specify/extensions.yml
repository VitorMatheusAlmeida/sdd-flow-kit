# sdd-flow-kit hooks in the spec-kit cycle.
# The spec-kit generated SKILL.md files (speckit-*) read this file before and after each command and run what is here.
# The skills it calls (speckit-flows, speckit-tables) are not generated by spec-kit: they survive upgrades.
# With no argument, each skill works out what to do from the state of the feature folder.
# Project setup (language, base branch, schema source) comes from sdd.config.json at the repository root.

hooks:
  after_plan:
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Creates tabelas.filtro.json, tabelas.planejado.dbml and tabelas.dbml (dbdiagram) from the data model
      prompt: Generate the diagram of the tables the feature will touch
      optional: false
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Creates fluxos.drawio (detailed decision flowchart) and roteiros/R##-*.md (walkthrough scripts) from spec and plan
      prompt: Generate the flowchart and the walkthrough scripts
      optional: false

  after_tasks:
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Checks the draw.io against the scripts and appends a walkthrough task for every script that lacks one
      prompt: Ensure the walkthrough tasks
      optional: false

  after_implement:
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Regenerates tabelas.dbml with the implemented schema and removes from the planned file what already exists
      prompt: Update the table diagram
      optional: false

  before_converge:
    - extension: sdd-flow-kit-flows
      command: speckit.flows
      description: Reads what the owner changed in fluxos.drawio since the last commit, judges each change and turns the valid ones into impact on scripts, spec and tasks
      prompt: Sync the flowchart before converging
      optional: false
    - extension: sdd-flow-kit-tables
      command: speckit.tables
      description: Absorbs the owner's hand edits to tabelas.dbml (after judging them), regenerates it and points out touched tables outside the filter
      prompt: Update the table diagram
      optional: false
